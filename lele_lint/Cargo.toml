[package]
name = "lele_lint"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"

[dev-dependencies]
tempfile = "3"
