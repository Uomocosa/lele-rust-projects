[workspace]
members = ["."]
exclude = ["contract"]
resolver = "3"

[package]
name = "clicker-game"
version = "0.1.0"
edition = "2024"

[lib]
name = "clicker_game_lib"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "clicker-game"
path = "src/main.rs"

[dependencies]
freenet_libp2p_bevy_plugin = { package = "freenet-libp2p-bevy-plugin", path = "../../freenet_libp2p_bevy_plugin" }
clap = { version = "4", features = ["derive"] }
bevy = "=0.19.0"
derive_more = { version = "=1.0.0", features = ["deref", "deref_mut"] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
serde = { version = "=1.0.229", features = ["derive"] }
bincode = "=1.3.3"