[package]
name = "freenet_contract_harness"
version = "0.1.0"
edition = "2024"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dependencies]
freenet-stdlib = { version = "=0.8.5", features = ["contract"] }
serde = { version = "=1.0.228", features = ["derive"] }
bincode = "=1.3.3"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# Debug info is a big RAM/disk cost; keep only line tables for our crate
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
