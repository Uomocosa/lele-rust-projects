[package]
name = "telegram_bot"
version = "0.1.0"
edition = "2024"
description = "Blocking Telegram Bot API senders for debug tooling (text/photo/video)"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"] }
serde_json = "=1.0.150"
telegram_bot_macros = { path = "../telegram_bot_macros" }
thiserror = "=2.0.18"
dotenvy = "=0.15.7"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
