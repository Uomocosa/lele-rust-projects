[package]
name = "deskctrl-mcp"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "deskctrl-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "2.2", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
schemars = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "json"] }
dotenvy = "0.15"
x11rb = { version = "0.14.0", features = ["xtest"] }

[lints.rust]
non_snake_case = "allow"
