[package]
name = "deskctrl-mcp"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "deskctrl-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=2.2.0", features = ["server", "transport-io"] }
tokio = { version = "=1.53.1", features = ["full"] }
schemars = "=1.2.2"
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
anyhow = "=1.0.104"
reqwest = { version = "=0.12.28", default-features = false, features = ["multipart", "rustls-tls", "json"] }
dotenvy = "=0.15.7"
x11rb = { version = "=0.14.0", features = ["xtest"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
derive_more = { version = "=1.0.0", features = ["deref"] }

[lints.rust]
non_snake_case = "allow"
