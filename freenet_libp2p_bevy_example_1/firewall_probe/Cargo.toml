[package]
name = "firewall_probe"
version = "0.1.0"
edition = "2024"

[dependencies]
freenet = "=0.2.123"
freenet-stdlib = { version = "=0.8.5", features = ["net"] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = "=0.27.0"
tempfile = "=3.27.0"
hex = "=0.4.3"
http = "=1.3.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
