[package]
name = "bevy_freenet"
version = "0.1.2"
edition = "2024"

[lib]
name = "freenet_libp2p_bevy_example_1_lib"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "freenet-libp2p-bevy-example-1"
path = "src/main.rs"

[dependencies]
bevy = "0.19"
avian2d = "0.7"
derive_more = { version = "1", features = ["deref", "deref_mut"] }
freenet = "0.2"
freenet-stdlib = { version = "0.8", features = ["net"] }
libp2p = { version = "0.56", features = [
    "tokio", "quic", "tcp", "noise", "yamux", "dns",
    "identify", "ping", "autonat", "relay", "dcutr",
    "request-response", "macros",
] }
tokio = { version = "1", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.27"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
http = "1"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
