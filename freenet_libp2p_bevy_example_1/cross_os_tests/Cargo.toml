[package]
name = "cross_os_tests"
version = "0.1.0"
edition = "2024"

[[test]]
name = "peer_discovery"
path = "peer_discovery.rs"

[[test]]
name = "movement_sync"
path = "movement_sync.rs"

[dependencies]
bevy = "=0.19.0"
tokio = { version = "=1.53.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
testing = { path = "../testing" }
