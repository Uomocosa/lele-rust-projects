[package]
name = "mainnet-automation"
version = "0.1.0"
edition = "2024"

[lib]
name = "mainnet_automation"
crate-type = ["lib"]

[[bin]]
name = "mainnet-automation"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
thiserror = "=2.0.20"
tempfile = "=3.27.0"
x11rb = { version = "=0.14.0", features = ["xtest"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"] }
regex = "1"
dotenvy = "=0.15.7"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }