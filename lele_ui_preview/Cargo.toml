[package]
name = "lele_ui_preview"
version = "0.1.0"
edition = "2024"
description = "Crawl an app's UI states (web via Chrome DevTools, Bevy via BRP) into a generated ui_preview/ folder"
license = "MIT OR Apache-2.0"

[[bin]]
name = "lele-ui-preview"
path = "src/main.rs"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dependencies]
base64 = "=0.22.1"
blake3 = "=1.8.7"
clap = { version = "=4.6.6", features = ["derive"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
toml = "=1.1.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
ureq = { version = "=3.4.2", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# Debug info is a big RAM/disk cost; keep only line tables for our crate
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
