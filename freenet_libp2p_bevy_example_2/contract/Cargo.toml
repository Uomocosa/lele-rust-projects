[workspace]

[package]
name = "membership_contract"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []

[dependencies]
freenet-stdlib = { version = "=0.8.5", features = ["contract"] }
freenet-macros = "=0.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
bincode = "=1.3.3"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "std"] }
thiserror = "=2.0.20"

[profile.release]
lto = true
opt-level = "z"
strip = true