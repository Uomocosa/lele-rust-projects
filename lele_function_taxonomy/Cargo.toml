[package]
name = "lele_function_taxonomy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Precise function honesty taxonomy via rustc MIR — a require=honest boundary must contain only honest functions"
license = "MIT"
default-run = "lele-function-taxonomy"

[[bin]]
name = "lele-function-taxonomy"
path = "src/main.rs"

[[bin]]
name = "lele-taxonomy-driver"
path = "src/driver/main.rs"

[build-dependencies]
quote = "=1.0.47"
proc-macro2 = "=1.0.107"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
thiserror = "=2.0.19"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.8.23"
cargo_metadata = "=0.23.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
syn = { version = "=2.0.119", features = ["full", "visit", "extra-traits"] }
quote = "=1.0.47"
proc-macro2 = "=1.0.107"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
implicit_hasher = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
explicit_iter_loop = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_like_matches_macro = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
ptr_arg = "allow"
redundant_clone = "allow"
redundant_closure_for_method_calls = "allow"
redundant_pub_crate = "allow"
semicolon_if_nothing_returned = "allow"
single_char_pattern = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
unnecessary_trailing_comma = "allow"
unnested_or_patterns = "allow"
used_underscore_binding = "allow"
use_self = "allow"

[dev-dependencies]
tempfile = "=3.27.0"
walkdir = "=2.5.0"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# Debug info is a big RAM/disk cost; keep only line tables for our crate
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
