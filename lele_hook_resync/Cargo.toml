[package]
name = "lele_hook_resync"
version = "0.1.0"
edition = "2024"
description = "Rebuilds the combined root .pre-commit-config.yaml from per-crate devenv hook configs"
license = "MIT OR Apache-2.0"

[[bin]]
name = "lele-hook-resync"
path = "src/main.rs"

[lib]
name = "lele_hook_resync_lib"
path = "src/lib.rs"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dependencies]
clap = { version = "=4.5.38", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"

[dev-dependencies]
tempfile = "=3.14.0"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# Debug info is a big RAM/disk cost; keep only line tables for our crate
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
