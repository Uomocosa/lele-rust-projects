[package]
name = "freenet_bevy"
version = "0.1.0"
edition = "2024"

[lib]
name = "freenet_bevy"
path = "src/lib.rs"

[[bin]]
name = "freenet-bevy"
path = "src/main.rs"

[[test]]
name = "bevy_ui_smoke"
path = "integration_tests/bevy_ui_smoke.rs"

[dependencies]
freenet = "0.2"
freenet-stdlib = { version = "0.8", features = ["net"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.27"
http = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "2"
hex = "0.4"
tempfile = "3"
bevy = "0.19"
bevy_tweening = "0.16"
chrono = "0.4"

[dev-dependencies]
testing = { path = "testing" }
