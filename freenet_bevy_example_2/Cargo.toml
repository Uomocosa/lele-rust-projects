[package]
name = "freenet_bevy"
version = "0.1.0"
edition = "2024"

[lib]
name = "freenet_bevy"
path = "src/lib.rs"

[[bin]]
name = "freenet-bevy"
path = "src/main.rs"

[[test]]
name = "bevy_ui_smoke"
path = "integration_tests/bevy_ui_smoke.rs"

[dependencies]
freenet = "=0.2.123"
freenet-stdlib = { version = "=0.8.5", features = ["net"] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "=0.27.0"
http = "=1.5.0"
futures-util = "=0.3.33"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
serde = { version = "=1.0.229", features = ["derive"] }
bincode = "=1.3.3"
thiserror = "=2.0.19"
hex = "=0.4.3"
tempfile = "=3.27.0"
bevy = "=0.19.0"
bevy_tweening = "=0.16.0"
chrono = "=0.4.45"

[dev-dependencies]
testing = { path = "testing" }
