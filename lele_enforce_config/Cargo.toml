[package]
name = "lele_enforce_config"
version = "0.1.0"
edition = "2024"
description = "Enforces lele devenv.nix tasks and hooks across crates"

[[bin]]
name = "lele-enforce-config"
path = "src/main.rs"

[lib]
name = "lele_enforce_config_lib"
path = "src/lib.rs"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
must_use_candidate = "allow"
map_unwrap_or = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
manual_let_else = "allow"
collapsible_if = "allow"
uninlined_format_args = "allow"

[dependencies]
clap = { version = "=4.5.38", features = ["derive"] }
derive_more = { version = "=1.0.0", features = ["deref"] }
globset = "=0.4.18"
thiserror = "=2.0.12"
serde = { version = "=1.0.219", features = ["derive"] }
toml = "=0.8.23"

[dev-dependencies]
tempfile = "=3.14.0"
