[package]
name = "freenet_example_3"
version = "0.3.0"
edition = "2024"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"



[features]
dev = ["dep:serde_json", "dep:reqwest", "dep:dotenvy", "dep:chrono"]
default = []

[lib]
name = "freenet_example_3"
path = "src/lib.rs"

[[bin]]
name = "freenet-example-3"
path = "src/main.rs"

[[example]]
name = "standalone_demo"
path = "examples/standalone_demo.rs"
required-features = ["dev"]

[[example]]
name = "publish_subscribe"
path = "examples/publish_subscribe.rs"
required-features = ["dev"]

[[test]]
name = "full_lifecycle"
path = "tests/integration/full_lifecycle.rs"
required-features = ["dev"]

[[test]]
name = "persistence"
path = "tests/integration/persistence.rs"
required-features = ["dev"]

[[test]]
name = "publish_subscribe"
path = "tests/integration/publish_subscribe.rs"
required-features = ["dev"]

[[test]]
name = "standalone_demo"
path = "tests/integration/standalone_demo.rs"
required-features = ["dev"]

[[test]]
name = "two_writers"
path = "tests/integration/two_writers.rs"
required-features = ["dev"]

[[test]]
name = "multi_subscriber_notifications"
path = "tests/integration/multi_subscriber_notifications.rs"
required-features = ["dev"]

[[test]]
name = "two_clients_talk_via_node"
path = "tests/integration/two_clients_talk_via_node.rs"
required-features = ["dev"]

[[test]]
name = "gateway_subprocess_smoke"
path = "tests/e2e_local/gateway_subprocess_smoke.rs"
required-features = ["dev"]

[[test]]
name = "cross_os_reconcile"
path = "tests/e2e_cross_os/cross_os_reconcile.rs"
harness = true
required-features = ["dev"]

[[test]]
name = "mainnet_local"
path = "tests/e2e_local/mainnet.rs"
required-features = ["dev"]

[[test]]
name = "mainnet_cross"
path = "tests/e2e_cross_os/mainnet.rs"
required-features = ["dev"]

[[test]]
name = "example_standalone_demo"
path = "tests/examples/standalone_demo.rs"
required-features = ["dev"]

[[test]]
name = "example_publish_subscribe"
path = "tests/examples/publish_subscribe.rs"
required-features = ["dev"]

[[test]]
name = "example_p2p_counter_gateway"
path = "tests/examples/p2p_counter_gateway.rs"
required-features = ["dev"]

[[test]]
name = "example_connect_to_external"
path = "tests/examples/connect_to_external.rs"
required-features = ["dev"]

[[test]]
name = "example_p2p_counter"
path = "tests/examples/p2p_counter.rs"
required-features = ["dev"]

[dependencies]
freenet = "=0.2.132"
freenet-stdlib = { version = "=0.8.5", features = ["net"] }
tokio = { version = "=1.52.3", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "=0.27.0"
http = "=1.4.1"
futures-util = "=0.3.32"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
serde = { version = "=1.0.228", features = ["derive"] }
bincode = "=1.3.3"
thiserror = "=2.0.18"
tempfile = "=3.27.0"
hex = "=0.4.3"
serde_json = { version = "=1.0.150", optional = true }
clap = { version = "=4.5.39", features = ["derive"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"], optional = true }
dotenvy = { version = "=0.15.7", optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"], optional = true }
