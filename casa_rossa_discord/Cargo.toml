[package]
name = "casa_rossa_discord"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "casa-rossa-discord"
path = "src/main.rs"

[dependencies]
serenity = { version = "=0.12.5", default-features = false, features = [
    "client", "gateway", "rustls_backend", "model", "builder", "http",
] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
html_scraper = { package = "scraper", version = "=0.22.0" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros"] }
thiserror = "=2.0.19"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
dotenvy = "=0.15.7"

[lints.rust]
non_snake_case = "allow"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# Debug info is a big RAM/disk cost; keep only line tables for our crate
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
