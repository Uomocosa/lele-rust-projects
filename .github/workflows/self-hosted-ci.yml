name: self-hosted CI

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate folder name (e.g. freenet_libp2p_bevy_example)
        required: false
        default: freenet_libp2p_bevy_example
      run-tests:
        description: Run the full test gate on Linux + Windows (build, fmt, clippy, tests, subcrates, lele_lint)
        type: boolean
        default: true
      release-builds:
        description: Build binaries on Linux + Windows and run the cross-OS suite
        type: boolean
        default: true
      build-mode:
        description: Build profile for the binary jobs (dev = fast debug, release = --release)
        type: choice
        options:
          - dev
          - release
        default: dev
      clean:
        description: Clean the persistent cargo target dirs first (forces a cold build)
        type: boolean
        default: false
      jobs:
        description: Which stage to run (all = full pipeline; otherwise only the selected stage runs, with dependent stages skipped)
        type: choice
        options:
          - all
          - test
          - build
          - cross-os
          - test-windows-firewall
        default: all

jobs:
  resolve:
    runs-on: [self-hosted, linux]
    outputs:
      crate: ${{ steps.check.outputs.crate }}
      testing_pkg: ${{ steps.pkgs.outputs.testing_pkg }}
      crossos_pkg: ${{ steps.pkgs.outputs.crossos_pkg }}
      determinism_test: ${{ steps.pkgs.outputs.determinism_test }}
      has_firewall_probe: ${{ steps.pkgs.outputs.has_firewall_probe }}
      has_game_probes: ${{ steps.pkgs.outputs.has_game_probes }}
      has_mainnet_probe: ${{ steps.pkgs.outputs.has_mainnet_probe }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate crate folder
        id: check
        run: |
          set -euo pipefail
          CRATE="${{ inputs.crate }}"
          [ -d "$CRATE" ] || { echo "crate folder '$CRATE' not found" >&2; exit 1; }
          [ -f "$CRATE/Cargo.toml" ] || { echo "no Cargo.toml in '$CRATE'" >&2; exit 1; }
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"

      # Per-crate subcrate names + capabilities. The `_3` suffix (example_3) uses the `_3`
      # subcrates and ships an `engine_determinism` probe (POLISH §3 cross-OS hash record);
      # example_1 keeps its original names and has no determinism probe yet.
      # Crates without a `cross_os_tests` subcrate (e.g. freenet_example_2) run their cross-OS
      # probe as an #[ignore]d integration test of the main package instead, so crossos_pkg
      # falls back to the main package name and the game-specific probe jobs are skipped.
      - name: Resolve per-crate subcrate package names
        id: pkgs
        run: |
          set -euo pipefail
          CRATE="${{ inputs.crate }}"
          case "$CRATE" in
            freenet_example)
              echo "testing_pkg=" >> "$GITHUB_OUTPUT"
              echo "crossos_pkg=freenet_example" >> "$GITHUB_OUTPUT"
              echo "determinism_test=" >> "$GITHUB_OUTPUT"
              ;;
            *_3)
              echo "testing_pkg=testing_3" >> "$GITHUB_OUTPUT"
              echo "crossos_pkg=cross_os_tests_3" >> "$GITHUB_OUTPUT"
              echo "determinism_test=engine_determinism" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "determinism_test=" >> "$GITHUB_OUTPUT"
              if [ -f "$CRATE/testing/Cargo.toml" ]; then
                echo "testing_pkg=testing" >> "$GITHUB_OUTPUT"
              else
                echo "testing_pkg=" >> "$GITHUB_OUTPUT"
              fi
              if [ -f "$CRATE/cross_os_tests/Cargo.toml" ]; then
                echo "crossos_pkg=cross_os_tests" >> "$GITHUB_OUTPUT"
              else
                PKG=$(grep -m1 '^name' "$CRATE/Cargo.toml" | sed 's/^name *= *"\(.*\)"/\1/')
                echo "crossos_pkg=$PKG" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac
          if [ -f "$CRATE/firewall_probe/Cargo.toml" ]; then
            echo "has_firewall_probe=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_firewall_probe=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$CRATE/cross_os_tests/Cargo.toml" ]; then
            echo "has_game_probes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_game_probes=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$CRATE/integration_tests/cross_os_reconcile.rs" ] || [ -f "$CRATE/tests/e2e_cross_os/cross_os_reconcile.rs" ]; then
            echo "has_mainnet_probe=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_mainnet_probe=false" >> "$GITHUB_OUTPUT"
          fi

  firewall-probe:
    needs: resolve
    if: (inputs.jobs == 'all' || inputs.jobs == 'test' || inputs.jobs == 'test-windows-firewall') && needs.resolve.outputs.has_firewall_probe == 'true'
    uses: ./.github/workflows/firewall-probe.yml
    with:
      crate: ${{ needs.resolve.outputs.crate }}

  test:
    needs: resolve
    if: (inputs.jobs == 'all' || inputs.jobs == 'test') && (inputs.run-tests || inputs.jobs == 'test')
    runs-on: [self-hosted, "${{ matrix.os }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target_dir: /home/uomocosa/.cache/frt-test
          - os: windows
            target_dir: 'C:\cargo-target\frt-test'
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CARGO_BUILD_JOBS: ${{ matrix.os == 'windows' && '1' || '6' }}
      RUSTFLAGS: ""
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Clean persistent target dir (cold build)
        if: inputs.clean
        run: rm -rf "$CARGO_TARGET_DIR"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'windows'
        with:
          components: clippy, rustfmt

      - name: Install rust toolchain (windows, git-bash)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable --profile default -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustup component add clippy rustfmt

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Build all workspace targets
        run: cargo build --workspace --all-targets

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run all workspace tests
        run: cargo test --workspace --all-targets

      # The cross-OS probes are #[ignore]d — driven per-machine by the cross-os jobs (example_1:
      # cross_os_tests peer_discovery/movement_sync; example_3: cross_os_tests_3 adds
      # engine_determinism, and its former e2e_tests_3 crate was removed in favour of these
      # probes + mainnet_automation_3). Local port-binding harnesses run as integration_tests
      # via the workspace `cargo test` above.
      # With the standing Windows Firewall fix (NotifyOnListen=False + broad Allow rules) hashed
      # test exes no longer re-trigger the prompt, so they need no stable-name [[bin]] path.

      - name: lele_lint
        run: cargo run --manifest-path ../lele_lint/Cargo.toml

  build-contract:
    needs: resolve
    if: (inputs.jobs == 'all' && inputs.release-builds) || inputs.jobs == 'build' || inputs.jobs == 'cross-os'
    runs-on: [self-hosted, linux]
    env:
      CARGO_TARGET_DIR: /home/uomocosa/.cache/frt-ci-contract
      RUSTFLAGS: ""
    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Build contract WASM once
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        working-directory: ${{ needs.resolve.outputs.crate }}/contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Upload contract WASM
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: ${{ env.CARGO_TARGET_DIR }}/wasm32-unknown-unknown/release/*.wasm

  build:
    needs: [resolve, build-contract, test]
    if: (inputs.jobs == 'all' || inputs.jobs == 'build') && (inputs.release-builds || inputs.jobs == 'build') && needs.test.result != 'failure'
    runs-on: [self-hosted, "${{ matrix.os }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target_dir: /home/uomocosa/.cache/frt-ci
          - os: windows
            target_dir: 'C:\cargo-target\ci'
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CARGO_BUILD_JOBS: ${{ matrix.os == 'windows' && '1' || '6' }}
      RUSTFLAGS: ""
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'windows'

      - name: Install rust toolchain (windows, git-bash)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable --profile default -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustup component add clippy rustfmt

      - name: Clean persistent target dir (cold build)
        if: inputs.clean
        run: rm -rf "$CARGO_TARGET_DIR"

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Download pre-built contract WASM
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: contract-wasm-download

      - name: Place contract WASM at embed location
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        run: |
          src=$(find "$GITHUB_WORKSPACE/contract-wasm-download" -name '*.wasm' | head -n1)
          cp "$src" "contract/$(basename "$src")"

      - name: Build binary
        run: cargo build --workspace ${{ inputs.build-mode == 'release' && '--release' || '' }}

      - name: Resolve binary name
        id: bin
        run: |
          BIN=$(cargo metadata --no-deps --format-version 1 | python3 -c "
          import json, sys
          pkg = json.load(sys.stdin)['packages'][0]
          bins = [t['name'] for t in pkg['targets'] if 'bin' in t['kind']]
          print(bins[0] if bins else pkg['name'].replace('-', '_'))
          ")
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.crate }}-selfhosted-${{ matrix.os }}-${{ inputs.build-mode }}
          path: ${{ env.CARGO_TARGET_DIR }}/${{ inputs.build-mode == 'release' && 'release' || 'debug' }}/${{ steps.bin.outputs.bin }}${{ matrix.os == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  cross-os-build:
    # Depends only on build-contract (for the embedded wasm), NOT on the `build` binary job: the
    # cross-OS probes compile cross_os_tests themselves. Keeping `build` out lets jobs=cross-os run
    # standalone — otherwise build (skipped for jobs=cross-os) would auto-skip this whole chain.
    needs: [resolve, build-contract]
    if: (inputs.jobs == 'all' || inputs.jobs == 'cross-os') && (inputs.release-builds || inputs.jobs == 'cross-os')
    runs-on: [self-hosted, "${{ matrix.os }}"]
    # Generous: a clean=true run cold-builds the cross-OS probe tests (Windows ~10.5 min at jobs=4; the
    # Windows runner now builds at CARGO_BUILD_JOBS=1 for RAM headroom, so allow ~3-5x that).
    # 15 min was too tight and cancelled the whole run.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target_dir: /home/uomocosa/.cache/frt-crossos
          - os: windows
            target_dir: 'C:\cargo-target\cross-os'
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      # Cross-OS flow uses the same build settings on Linux as on Windows (jobs=1) so both
      # machines pace at the same parallelism; Linux is still faster but we wait on Windows
      # anyway. The normal test/build jobs keep more Linux parallelism for fast iteration.
      CARGO_BUILD_JOBS: "1"
      RUSTFLAGS: ""
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'windows'

      - name: Install rust toolchain (windows, git-bash)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable --profile default -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustup component add clippy rustfmt

      - name: Clean persistent target dir (cold build)
        if: inputs.clean
        run: rm -rf "$CARGO_TARGET_DIR"

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Download pre-built contract WASM
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: contract-wasm-download

      - name: Place contract WASM at embed location
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        run: |
          src=$(find "$GITHUB_WORKSPACE/contract-wasm-download" -name '*.wasm' | head -n1)
          cp "$src" "contract/$(basename "$src")"

      - name: Clippy testing crate
        if: needs.resolve.outputs.testing_pkg != ''
        run: cargo clippy --all-targets -p ${{ needs.resolve.outputs.testing_pkg }} -- -D warnings

      - name: Build cross-OS probe tests (compile check, not run)
        if: needs.resolve.outputs.has_game_probes == 'true'
        run: |
          set -euo pipefail
          cargo test -p ${{ needs.resolve.outputs.crossos_pkg }} --no-run

      - name: Build cross-OS mainnet reconcile probe (compile check, not run)
        if: needs.resolve.outputs.has_mainnet_probe == 'true'
        run: |
          set -euo pipefail
          if cargo test -p ${{ needs.resolve.outputs.crossos_pkg }} --features dev --test cross_os_reconcile --no-run 2>/dev/null; then
            echo "built with --features dev"
          else
            cargo test -p ${{ needs.resolve.outputs.crossos_pkg }} --test cross_os_reconcile --no-run
          fi

      - name: Run engine determinism gate (per-machine POLISH §3 hash record)
        if: needs.resolve.outputs.determinism_test != ''
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CROSS_OS_MACHINE="${{ matrix.os }}"
          export CROSS_OS_LOG_DETERMINISM="$GITHUB_WORKSPACE/${{ needs.resolve.outputs.crate }}/cross-os-determinism-${{ matrix.os }}.log"
          cargo test -p ${{ needs.resolve.outputs.crossos_pkg }} \
            --test ${{ needs.resolve.outputs.determinism_test }} -- --ignored --nocapture

      - name: Upload cross-OS determinism log
        if: needs.resolve.outputs.determinism_test != ''
        uses: actions/upload-artifact@v4
        with:
          name: cross-os-determinism-log-${{ matrix.os }}
          path: ${{ needs.resolve.outputs.crate }}/cross-os-determinism-${{ matrix.os }}.log
          if-no-files-found: error

  cross-os-peer-discovery:
    # Build then run, synchronized per test: both machines run the SAME probe at the same time.
    # A matrix job's legs run in parallel and the next job's `needs` is satisfied only after ALL
    # legs of the dependency complete, so cross-os-movement-sync cannot start until both machines
    # finished peer_discovery. The generous timeout guarantees the run eventually stops even if a
    # machine is left idle. Game crates only — mainnet-probe crates run cross-os-reconcile below.
    needs: [resolve, cross-os-build]
    if: (inputs.jobs == 'all' || inputs.jobs == 'cross-os') && (inputs.release-builds || inputs.jobs == 'cross-os') && needs.cross-os-build.result == 'success' && needs.resolve.outputs.has_game_probes == 'true'
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target_dir: /home/uomocosa/.cache/frt-crossos
          - os: windows
            target_dir: 'C:\cargo-target\cross-os'
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CARGO_BUILD_JOBS: "1"
      CROSS_OS_KEY: cross-os-${{ github.run_id }}
      CROSS_OS_MACHINE: ${{ matrix.os }}
      CROSS_OS_DURATION_SECS: "300"
      # Engine/netcode greps ("received peer input", "sending engine snapshot", "state hash")
      # live on the p2p target at debug/info; roster=trace covers join/merge. freenet_bevy is
      # example_1-only but an unknown directive is harmless to EnvFilter.
      RUST_LOG: warn,roster=trace,p2p=debug,freenet_bevy=debug
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Run cross-OS peer-discovery probe
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CROSS_OS_LOG="$GITHUB_WORKSPACE/${{ needs.resolve.outputs.crate }}/cross-os-${{ matrix.os }}.log"
          cargo test -p ${{ needs.resolve.outputs.crossos_pkg }} \
            --test peer_discovery -- --ignored --nocapture

      - name: Upload cross-OS log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-os-log-${{ matrix.os }}
          path: ${{ needs.resolve.outputs.crate }}/cross-os-${{ matrix.os }}.log
          if-no-files-found: error

  cross-os-movement-sync:
    # Runs only after BOTH machines finished cross-os-peer-discovery; both machines start the
    # movement-sync probe at the same time.
    needs: [resolve, cross-os-peer-discovery]
    if: (inputs.jobs == 'all' || inputs.jobs == 'cross-os') && (inputs.release-builds || inputs.jobs == 'cross-os') && needs.cross-os-peer-discovery.result == 'success'
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target_dir: /home/uomocosa/.cache/frt-crossos
          - os: windows
            target_dir: 'C:\cargo-target\cross-os'
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CARGO_BUILD_JOBS: "1"
      CROSS_OS_KEY: cross-os-${{ github.run_id }}
      CROSS_OS_MACHINE: ${{ matrix.os }}
      CROSS_OS_DURATION_SECS: "300"
      # Same rationale as the peer-discovery job's RUST_LOG.
      RUST_LOG: warn,roster=trace,p2p=debug,freenet_bevy=debug
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Run cross-OS movement-sync probe
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CROSS_OS_LOG="$GITHUB_WORKSPACE/${{ needs.resolve.outputs.crate }}/cross-os-movement-${{ matrix.os }}.log"
          cargo test -p ${{ needs.resolve.outputs.crossos_pkg }} \
            --test movement_sync -- --ignored --nocapture

      - name: Upload cross-OS movement log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-os-movement-log-${{ matrix.os }}
          path: ${{ needs.resolve.outputs.crate }}/cross-os-movement-${{ matrix.os }}.log
          if-no-files-found: error

  cross-os-reconcile:
    # Mainnet-probe crates (e.g. freenet_example_2): both machines start a mainnet client node
    # and a counter client with the SAME contract params (derived from the run id) at the same
    # time, tick for the duration, and must observe each other's slot through the network —
    # the real deployment topology: fresh contract, cross-OS, cross-network.
    needs: [resolve, cross-os-build]
    if: (inputs.jobs == 'all' || inputs.jobs == 'cross-os') && (inputs.release-builds || inputs.jobs == 'cross-os') && needs.cross-os-build.result == 'success' && needs.resolve.outputs.has_mainnet_probe == 'true'
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
          - os: windows
    env:
      CARGO_TARGET_DIR: ${{ matrix.os == 'windows' && 'C:\\cargo-target\\cross-os' || '/home/uomocosa/.cache/frt-crossos' }}
      CARGO_BUILD_JOBS: ${{ matrix.os == 'windows' && '1' || '6' }}
      CROSS_OS_MACHINE: ${{ matrix.os }}
      CROSS_OS_KEY: cross-os-${{ github.run_id }}
      CROSS_OS_DEADLINE_SECS: "900"
      # Node-level info (ring connections, broadcast targets, subscribe/put ops) plus the
      # client's bridge lines — the VPN-exit failure of run 33261445827 was undiagnosable
      # with RUST_LOG=warn.
      RUST_LOG: warn,freenet=info,freenet_example=info
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Run cross-OS mainnet reconcile probe
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CROSS_OS_LOG="$GITHUB_WORKSPACE/${{ needs.resolve.outputs.crate }}/cross-os-reconcile-${{ matrix.os }}.log"
          cargo test -p ${{ needs.resolve.outputs.crossos_pkg }} --features dev --test cross_os_reconcile -- --ignored --nocapture || cargo test -p ${{ needs.resolve.outputs.crossos_pkg }} --test cross_os_reconcile -- --ignored --nocapture

      - name: Upload cross-OS reconcile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-os-reconcile-log-${{ matrix.os }}
          path: ${{ needs.resolve.outputs.crate }}/cross-os-reconcile-${{ matrix.os }}.log
          if-no-files-found: error

  cross-os-reconcile-verify:
    needs: [resolve, cross-os-reconcile]
    if: always() && needs.resolve.outputs.has_mainnet_probe == 'true' && needs.cross-os-reconcile.result != 'skipped'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cross-os-reconcile-log-linux
          path: verify/linux

      - uses: actions/download-artifact@v4
        with:
          name: cross-os-reconcile-log-windows
          path: verify/windows

      - name: Assert each OS observed the other through mainnet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys

          def load(path):
              own = None
              observed = set()
              count = 0
              try:
                  with open(path) as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          try:
                              rec = json.loads(line)
                          except json.JSONDecodeError:
                              continue
                          own = rec.get("own", own)
                          observed |= set(rec.get("foreign_tags", []))
                          count = max(count, rec.get("count", 0))
              except FileNotFoundError:
                  pass
              return own, observed, count

          l_own, l_obs, l_count = load("verify/linux/cross-os-reconcile-linux.log")
          w_own, w_obs, w_count = load("verify/windows/cross-os-reconcile-windows.log")

          if l_own is None or w_own is None:
              sys.exit("cross-os-reconcile-verify: a side produced no reconcile log")
          print(f"linux   own={l_own} observed={sorted(l_obs)} count={l_count}")
          print(f"windows own={w_own} observed={sorted(w_obs)} count={w_count}")

          if w_own not in l_obs:
              sys.exit(f"FAIL: linux never observed the windows slot {w_own} on mainnet")
          if l_own not in w_obs:
              sys.exit(f"FAIL: windows never observed the linux slot {l_own} on mainnet")
          if l_count <= 0 or w_count <= 0:
              sys.exit("FAIL: a side finished with a zero counter")
          print("PASS: cross-OS mainnet reconcile confirmed (each side merged the other's slot)")
          PY

  cross-os-verify:
    needs: [resolve, cross-os-movement-sync]
    if: (inputs.jobs == 'all' || inputs.jobs == 'cross-os') && needs.cross-os-movement-sync.result == 'success'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cross-os-log-linux
          path: verify/linux

      - uses: actions/download-artifact@v4
        with:
          name: cross-os-log-windows
          path: verify/windows

      - uses: actions/download-artifact@v4
        with:
          name: cross-os-movement-log-linux
          path: verify/linux-movement

      - uses: actions/download-artifact@v4
        with:
          name: cross-os-movement-log-windows
          path: verify/windows-movement

      - uses: actions/download-artifact@v4
        if: needs.resolve.outputs.determinism_test != ''
        with:
          name: cross-os-determinism-log-linux
          path: verify/linux-determinism

      - uses: actions/download-artifact@v4
        if: needs.resolve.outputs.determinism_test != ''
        with:
          name: cross-os-determinism-log-windows
          path: verify/windows-determinism

      - name: Assert each OS observed the other's player id and moved
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys

          def load(path):
              own, observed = None, set()
              try:
                  with open(path) as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          try:
                              rec = json.loads(line)
                          except json.JSONDecodeError:
                              continue
                          own = rec.get("own", own)
                          observed |= set(rec.get("observed", []))
              except FileNotFoundError:
                  pass
              return own, observed

          def load_movement(path):
              # returns (own, set of distinct remote_x values, set of distinct local_x values)
              own = None
              remote_xs = set()
              local_xs = set()
              try:
                  with open(path) as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          try:
                              rec = json.loads(line)
                          except json.JSONDecodeError:
                              continue
                          own = rec.get("own", own)
                          if rec.get("remote_x") is not None:
                              remote_xs.add(rec["remote_x"])
                          if rec.get("local_x") is not None:
                              local_xs.add(rec["local_x"])
              except FileNotFoundError:
                  pass
              return own, remote_xs, local_xs

          def load_determinism(path):
              # returns the final_state_hash from the engine determinism gate, or None
              try:
                  with open(path) as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          try:
                              rec = json.loads(line)
                          except json.JSONDecodeError:
                              continue
                          if "final_state_hash" in rec:
                              return rec["final_state_hash"]
              except FileNotFoundError:
                  pass
              return None

          l_own, l_obs = load("verify/linux/cross-os-linux.log")
          w_own, w_obs = load("verify/windows/cross-os-windows.log")

          if l_own is None or w_own is None:
              sys.exit("cross-os-verify: a side produced no roster log / no roster data")
          print(f"linux   own={l_own} observed={sorted(l_obs)}")
          print(f"windows own={w_own} observed={sorted(w_obs)}")

          if w_own not in l_obs:
              sys.exit(f"FAIL: linux never observed the windows player {w_own}")
          if l_own not in w_obs:
              sys.exit(f"FAIL: windows never observed the linux player {l_own}")
          print(f"PASS: cross-OS roster sync confirmed (linux saw {w_own}, windows saw {l_own})")

          l_own_m, l_remote_x, _ = load_movement("verify/linux-movement/cross-os-movement-linux.log")
          w_own_m, w_remote_x, _ = load_movement("verify/windows-movement/cross-os-movement-windows.log")
          if l_own_m is None or w_own_m is None:
              print("WARN: a movement log is missing; movement sync not verified")
          else:
              for name, own, remote_x in [("linux", l_own_m, l_remote_x), ("windows", w_own_m, w_remote_x)]:
                  if len(remote_x) < 2:
                      sys.exit(f"FAIL: {name} (own={own}) never saw its remote box move ({sorted(remote_x)})")
              print(f"PASS: movement propagated (linux saw remote x-positions {sorted(l_remote_x)}, windows saw {sorted(w_remote_x)})")

          # POLISH §3 cross-OS determinism: the engine determinism gate ran on both machines;
          # the final state hash must be identical. Crates without the gate (no artifacts) skip.
          l_hash = load_determinism("verify/linux-determinism/cross-os-determinism-linux.log")
          w_hash = load_determinism("verify/windows-determinism/cross-os-determinism-windows.log")
          if l_hash is None and w_hash is None:
              print("SKIP: no cross-OS determinism records (crate has no engine determinism gate)")
          elif l_hash is None or w_hash is None:
              sys.exit(f"FAIL: exactly one machine produced a determinism record (linux={l_hash}, windows={w_hash})")
          elif l_hash != w_hash:
              sys.exit(f"FAIL: cross-OS state hashes diverge (linux={l_hash}, windows={w_hash}); see docs/DETERMINISM.md -> fixed-point fallback")
          else:
              print(f"PASS: cross-OS engine determinism (final state hash {l_hash} identical on linux and windows)")
          PY
