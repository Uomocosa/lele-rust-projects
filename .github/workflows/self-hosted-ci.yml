name: self-hosted CI

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate folder name (e.g. freenet_libp2p_bevy_example_1)
        required: false
        default: freenet_libp2p_bevy_example_1
      run-tests:
        description: Run the full test gate on Linux + Windows (build, fmt, clippy, tests, subcrates, lele_lint)
        type: boolean
        default: true
      release-builds:
        description: Build binaries on Linux + Windows and run the cross-OS suite
        type: boolean
        default: true
      build-mode:
        description: Build profile for the binary jobs (dev = fast debug, release = --release)
        type: choice
        options:
          - dev
          - release
        default: dev
      clean:
        description: Clean the persistent cargo target dirs first (forces a cold build)
        type: boolean
        default: false
      jobs:
        description: Which stage to run (all = full pipeline; otherwise only the selected stage runs, with dependent stages skipped)
        type: choice
        options:
          - all
          - test
          - build
          - cross-os
          - test-windows-firewall
        default: all

jobs:
  resolve:
    runs-on: [self-hosted, linux]
    outputs:
      crate: ${{ steps.check.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate crate folder
        id: check
        run: |
          set -euo pipefail
          CRATE="${{ inputs.crate }}"
          [ -d "$CRATE" ] || { echo "crate folder '$CRATE' not found" >&2; exit 1; }
          [ -f "$CRATE/Cargo.toml" ] || { echo "no Cargo.toml in '$CRATE'" >&2; exit 1; }
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"

  firewall-probe:
    needs: resolve
    if: (inputs.jobs == 'all' || inputs.jobs == 'test' || inputs.jobs == 'test-windows-firewall')
    uses: ./.github/workflows/firewall-probe.yml
    with:
      crate: ${{ needs.resolve.outputs.crate }}

  test:
    needs: resolve
    if: (inputs.jobs == 'all' || inputs.jobs == 'test') && (inputs.run-tests || inputs.jobs == 'test')
    runs-on: [self-hosted, "${{ matrix.os }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target_dir: /home/uomocosa/.cache/frt-test
          - os: windows
            target_dir: 'C:\cargo-target\frt-test'
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CARGO_BUILD_JOBS: ${{ matrix.os == 'windows' && '1' || '6' }}
      RUSTFLAGS: ""
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Clean persistent target dir (cold build)
        if: inputs.clean
        run: rm -rf "$CARGO_TARGET_DIR"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'windows'
        with:
          components: clippy, rustfmt

      - name: Install rust toolchain (windows, git-bash)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable --profile default -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustup component add clippy rustfmt

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Build all targets
        run: cargo build --all-targets

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run all tests
        run: cargo test --all-targets

      - name: Build, clippy, test subcrates (testing/e2e_tests/integration_tests)
        run: |
          set -euo pipefail
          # Windows has very little RAM: link.exe OOMs (LNK1102) when several test binaries link
          # concurrently, so CARGO_BUILD_JOBS=1 (above) serializes every cargo job there and the
          # subcrate build is a type-check only (the cargo test below still links and runs each
          # binary). Linux keeps full parallelism and the real build.
          CHECK_OR_BUILD="${{ matrix.os == 'windows' && 'check' || 'build' }}"
          TEST_JOBS="${{ matrix.os == 'windows' && '-j 1' || '' }}"
          for sub in testing e2e_tests integration_tests; do
            [ -f "$sub/Cargo.toml" ] || continue
            echo "=== subcrate: $sub ==="
            cargo $CHECK_OR_BUILD --all-targets --manifest-path "$sub/Cargo.toml" $TEST_JOBS
            cargo clippy --all-targets --manifest-path "$sub/Cargo.toml" $TEST_JOBS -- -D warnings
            cargo test --all-targets --manifest-path "$sub/Cargo.toml" $TEST_JOBS
          done

      # The port-binding harnesses are [[bin]] targets (not integration tests) so cargo emits
      # them at stable, un-hashed paths like debug/<name>.exe — that lets Windows Firewall rules
      # keyed to those paths stay valid across dependency changes (a hashed deps/ name would go
      # stale on every cargo update and re-trigger the firewall prompt). They are run here
      # explicitly and sequentially. e2e_three_node_production_sync and cross_os_sync are excluded:
      # the former needs the public mainnet (internet), the latter is driven by the cross-os job.
      - name: Run local harness binaries (stable names, sequential)
        run: |
          set -euo pipefail
          for bin in two_node_roster two_node_box_count two_node_box_count_parallel \
                     local_two_node_production_sync; do
            echo "=== harness: $bin ==="
            cargo build --manifest-path testing/Cargo.toml --bin "$bin"
            "$CARGO_TARGET_DIR/debug/$bin"
          done

      - name: lele_lint
        run: cargo run --manifest-path ../lele_lint/Cargo.toml

  build-contract:
    needs: resolve
    if: (inputs.jobs == 'all' && inputs.release-builds) || inputs.jobs == 'build' || inputs.jobs == 'cross-os'
    runs-on: [self-hosted, linux]
    env:
      CARGO_TARGET_DIR: /home/uomocosa/.cache/frt-ci-contract
      RUSTFLAGS: ""
    defaults:
      run:
        shell: bash
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Build contract WASM once
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        working-directory: ${{ needs.resolve.outputs.crate }}/contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Upload contract WASM
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: ${{ env.CARGO_TARGET_DIR }}/wasm32-unknown-unknown/release/*.wasm

  build:
    needs: [resolve, build-contract, test]
    if: (inputs.jobs == 'all' || inputs.jobs == 'build') && (inputs.release-builds || inputs.jobs == 'build') && needs.test.result != 'failure'
    runs-on: [self-hosted, "${{ matrix.os }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target_dir: /home/uomocosa/.cache/frt-ci
          - os: windows
            target_dir: 'C:\cargo-target\ci'
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CARGO_BUILD_JOBS: ${{ matrix.os == 'windows' && '1' || '6' }}
      RUSTFLAGS: ""
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'windows'

      - name: Install rust toolchain (windows, git-bash)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable --profile default -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustup component add clippy rustfmt

      - name: Clean persistent target dir (cold build)
        if: inputs.clean
        run: rm -rf "$CARGO_TARGET_DIR"

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Download pre-built contract WASM
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: contract-wasm-download

      - name: Place contract WASM at embed location
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        run: |
          src=$(find "$GITHUB_WORKSPACE/contract-wasm-download" -name '*.wasm' | head -n1)
          cp "$src" "contract/$(basename "$src")"

      - name: Build binary
        run: cargo build ${{ inputs.build-mode == 'release' && '--release' || '' }}

      - name: Build subcrates (testing/e2e_tests/integration_tests)
        run: |
          set -euo pipefail
          # Windows has very little RAM: link.exe OOMs (LNK1102) linking several test binaries
          # concurrently, so CARGO_BUILD_JOBS=1 (above) serializes every cargo job there and the
          # subcrate build is a type-check only. Linux keeps full parallelism and the real build.
          CHECK_OR_BUILD="${{ matrix.os == 'windows' && 'check' || 'build' }}"
          TEST_JOBS="${{ matrix.os == 'windows' && '-j 1' || '' }}"
          for sub in testing e2e_tests integration_tests; do
            [ -f "$sub/Cargo.toml" ] || continue
            cargo $CHECK_OR_BUILD --all-targets --manifest-path "$sub/Cargo.toml" $TEST_JOBS
          done

      - name: Resolve binary name
        id: bin
        run: |
          BIN=$(cargo metadata --no-deps --format-version 1 | python3 -c "
          import json, sys
          pkg = json.load(sys.stdin)['packages'][0]
          bins = [t['name'] for t in pkg['targets'] if 'bin' in t['kind']]
          print(bins[0] if bins else pkg['name'].replace('-', '_'))
          ")
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.crate }}-selfhosted-${{ matrix.os }}-${{ inputs.build-mode }}
          path: ${{ env.CARGO_TARGET_DIR }}/${{ inputs.build-mode == 'release' && 'release' || 'debug' }}/${{ steps.bin.outputs.bin }}${{ matrix.os == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  cross-os-build:
    needs: [resolve, build-contract, build]
    if: (inputs.jobs == 'all' || inputs.jobs == 'cross-os') && (inputs.release-builds || inputs.jobs == 'cross-os') && needs.build.result != 'failure'
    runs-on: [self-hosted, "${{ matrix.os }}"]
    # Generous: a clean=true run cold-builds cross_os_sync (Windows ~10.5 min at jobs=4; the
    # Windows runner now builds at CARGO_BUILD_JOBS=1 for RAM headroom, so allow ~3-5x that).
    # 15 min was too tight and cancelled the whole run.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target_dir: /home/uomocosa/.cache/frt-crossos
          - os: windows
            target_dir: 'C:\cargo-target\cross-os'
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CARGO_BUILD_JOBS: ${{ matrix.os == 'windows' && '1' || '6' }}
      RUSTFLAGS: ""
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os != 'windows'

      - name: Install rust toolchain (windows, git-bash)
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain stable --profile default -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup default stable
          rustup component add clippy rustfmt

      - name: Clean persistent target dir (cold build)
        if: inputs.clean
        run: rm -rf "$CARGO_TARGET_DIR"

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      - name: Download pre-built contract WASM
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: contract-wasm-download

      - name: Place contract WASM at embed location
        if: hashFiles(format('{0}/contract/Cargo.toml', needs.resolve.outputs.crate)) != ''
        run: |
          src=$(find "$GITHUB_WORKSPACE/contract-wasm-download" -name '*.wasm' | head -n1)
          cp "$src" "contract/$(basename "$src")"

      - name: Clippy testing crate
        run: cargo clippy --all-targets --manifest-path testing/Cargo.toml -- -D warnings

      - name: Build cross-OS harness binary
        run: cargo build --manifest-path testing/Cargo.toml --bin cross_os_sync

  cross-os-run:
    # Split from cross-os-build so both machines finish building before either 5-minute probe
    # starts: both run legs become eligible at the same instant once every build leg completes,
    # so the probes overlap and cross-os-verify gets a fair chance to observe both players.
    needs: [resolve, cross-os-build]
    if: (inputs.jobs == 'all' || inputs.jobs == 'cross-os') && (inputs.release-builds || inputs.jobs == 'cross-os') && needs.cross-os-build.result != 'failure'
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            target_dir: /home/uomocosa/.cache/frt-crossos
          - os: windows
            target_dir: 'C:\cargo-target\cross-os'
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CROSS_OS_KEY: cross-os-${{ github.run_id }}
      CROSS_OS_MACHINE: ${{ matrix.os }}
      CROSS_OS_LOG: cross-os-${{ matrix.os }}.log
      CROSS_OS_DURATION_SECS: "300"
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && format('{0}/.github/scripts/git-bash.cmd', github.workspace) || 'bash --noprofile --norc -eo pipefail' }} {0}
        working-directory: ${{ needs.resolve.outputs.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Run cross-OS sync probe
        run: "$CARGO_TARGET_DIR/debug/cross_os_sync"

      - name: Upload cross-OS log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-os-log-${{ matrix.os }}
          path: ${{ needs.resolve.outputs.crate }}/cross-os-${{ matrix.os }}.log
          if-no-files-found: error

  cross-os-verify:
    needs: cross-os-run
    if: (inputs.jobs == 'all' || inputs.jobs == 'cross-os') && needs.cross-os-run.result == 'success'
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cross-os-log-linux
          path: verify/linux

      - uses: actions/download-artifact@v4
        with:
          name: cross-os-log-windows
          path: verify/windows

      - name: Assert each OS observed the other's player id
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys

          def load(path):
              own, observed = None, set()
              try:
                  with open(path) as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          try:
                              rec = json.loads(line)
                          except json.JSONDecodeError:
                              continue
                          own = rec.get("own", own)
                          observed |= set(rec.get("observed", []))
              except FileNotFoundError:
                  pass
              return own, observed

          l_own, l_obs = load("verify/linux/cross-os-linux.log")
          w_own, w_obs = load("verify/windows/cross-os-windows.log")

          if l_own is None or w_own is None:
              sys.exit("cross-os-verify: a side produced no log / no roster data")
          print(f"linux   own={l_own} observed={sorted(l_obs)}")
          print(f"windows own={w_own} observed={sorted(w_obs)}")

          if w_own not in l_obs:
              sys.exit(f"FAIL: linux never observed the windows player {w_own}")
          if l_own not in w_obs:
              sys.exit(f"FAIL: windows never observed the linux player {l_own}")
          print(f"PASS: cross-OS sync confirmed (linux saw {w_own}, windows saw {l_own})")
          PY
