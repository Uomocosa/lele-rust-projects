[package]
name = "freenet_libp2p_bevy_example"
version = "0.1.0"
edition = "2024"
description = "Shared blackboard game (lobbies, tool per player, Kademlia history) on P2PBevyPlugin"
license = "MIT OR Apache-2.0"

[lib]
name = "freenet_libp2p_bevy_example_lib"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "freenet-libp2p-bevy-example"
path = "src/main.rs"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dependencies]
freenet-libp2p-bevy-plugin = { path = "../freenet_libp2p_bevy_plugin" }
bevy = "=0.19.0"
derive_more = { version = "=2.1.1", features = ["deref", "deref_mut"] }
serde = { version = "=1.0.228", features = ["derive"] }
bincode = "=1.3.3"
blake3 = "=1.8.3"
thiserror = "=2.0.18"
tracing = "=0.1.44"
clap = { version = "=4.5.39", features = ["derive"] }
tokio = { version = "=1.52.3", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
