[tasks.build-contract]
description = "Build the membership contract WASM"
command = "cargo"
args = ["build", "--release", "--target", "wasm32-unknown-unknown"]
cwd = "./contract"

[tasks.copy-wasm]
description = "Copy WASM to repo root for include_bytes!"
command = "cp"
args = ["target/wasm32-unknown-unknown/release/membership_contract.wasm", "../contract/membership_contract.wasm"]
cwd = "./contract"
dependencies = ["build-contract"]

[tasks.test]
description = "Build contract WASM then run all tests"
dependencies = ["copy-wasm"]
command = "cargo"
args = ["test", "--", "--nocapture"]

[tasks.pre-push]
description = "Full verification before push"
dependencies = ["copy-wasm"]
script = """
set -e
cargo build --workspace --all-targets
cargo clippy --workspace --all-targets -- -D warnings
cargo fmt -- --check
cargo test --workspace --all-targets -- --nocapture
cargo run --manifest-path ../lele_lint/Cargo.toml
echo "ALL CHECKS PASSED"
"""

[tasks.clean]
description = "Clean all build artifacts"
command = "bash"
args = ["-c", "cargo clean && cd contract && cargo clean"]
