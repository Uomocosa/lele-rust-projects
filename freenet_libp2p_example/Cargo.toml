[package]
name = "freenet_libp2p_example"
version = "0.1.0"
edition = "2024"

[dependencies]
freenet = "=0.2.70"
freenet-stdlib = { version = "=0.8.1", features = ["net"] }
libp2p = { version = "=0.56.0", features = [
    "tcp", "quic", "noise", "yamux", "tokio", "dns", "ping",
] }
tokio = { version = "=1.52.3", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "=0.27.0"
http = "=1.4.1"
bincode = "=1.3.3"
tempfile = "=3.27.0"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
futures = "=0.3.32"
futures-util = "=0.3.32"
thiserror = "=2.0.18"
