[package]
name = "freenet_libp2p_example"
version = "0.1.0"
edition = "2024"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[lib]
name = "freenet_libp2p_example"
path = "src/lib.rs"

[[bin]]
name = "freenet-libp2p-example"
path = "src/main.rs"

[features]
dev = ["dep:serde_json", "dep:reqwest", "dep:dotenvy", "dep:chrono"]
default = []

[[test]]
name = "mainnet_local"
path = "tests/e2e_local/mainnet.rs"
required-features = ["dev"]

[dependencies]
freenet = "=0.2.132"
freenet-stdlib = { version = "=0.8.5", features = ["net"] }
libp2p = { version = "=0.56.0", features = ["tcp", "quic", "noise", "yamux", "tokio", "dns", "request-response", "ping"] }
tokio = { version = "=1.52.3", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "=0.27.0"
http = "=1.4.1"
futures = "=0.3.32"
futures-util = "=0.3.32"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing-appender = "=0.2.4"
serde = { version = "=1.0.228", features = ["derive"] }
bincode = "=1.3.3"
thiserror = "=2.0.18"
derive_more = { version = "=2.1.1", features = ["deref", "deref_mut"] }
tempfile = "=3.27.0"
hex = "=0.4.3"
clap = { version = "=4.5.39", features = ["derive"] }
ed25519-dalek = { version = "=2.1.0", features = ["rand_core"] }
rand = "=0.8.5"
getrandom = "=0.2.15"
serde_json = { version = "=1.0.150", optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"], optional = true }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"], optional = true }
dotenvy = { version = "=0.15.7", optional = true }
