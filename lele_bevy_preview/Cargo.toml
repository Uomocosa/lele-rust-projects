[package]
name = "lele_bevy_preview"
version = "0.1.0"
edition = "2024"
description = "Deterministic headless PNG/MP4 UI previews for Bevy plugins, with change-gated Telegram delivery"
license = "MIT OR Apache-2.0"

[lib]
name = "lele_bevy_preview"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "ui"] }
blake3 = "=1.8.7"
derive_more = { version = "=2.1.1", features = ["deref", "deref_mut"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tracing = "=0.1.44"
telegram_bot = { path = "../telegram_bot" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unchecked_time_subtraction = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
module_inception = "allow"
missing_errors_doc = "allow"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# Debug info is a big RAM/disk cost; keep only line tables for our crate
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false