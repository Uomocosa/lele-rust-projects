[tasks.build-contract]
description = "Build the global_counter contract WASM"
command = "cargo"
args = ["build", "--release", "--target", "wasm32-unknown-unknown"]
cwd = "./contract"

[tasks.copy-wasm]
description = "Copy WASM to repo root for include_bytes! (used by binary + tests)"
command = "cp"
args = ["target/wasm32-unknown-unknown/release/global_counter_contract.wasm", "../contract/global_counter_contract.wasm"]
cwd = "./contract"
dependencies = ["build-contract"]

[tasks.run-publisher]
description = "Connect to an existing node as publisher"
command = "cargo"
args = ["run", "--", "--role", "publish"]

[tasks.run-subscriber]
description = "Connect to an existing node as subscriber"
command = "cargo"
args = ["run", "--", "--role", "subscribe"]

[tasks.test]
description = "Build contract WASM then run all tests"
dependencies = ["copy-wasm"]
command = "cargo"
args = ["test", "--", "--nocapture"]

[tasks.test-no-capture]
description = "Build contract WASM then run tests without output capture (for debugging)"
dependencies = ["copy-wasm"]
command = "cargo"
args = ["test", "--", "--nocapture", "--test-threads", "1"]

[tasks.e2e]
description = "Run end-to-end tests only"
dependencies = ["copy-wasm"]
script = """
cargo build --release
cargo build --release --examples
cargo test --manifest-path e2e_tests/Cargo.toml --release -- --nocapture --test-threads=1
"""

[tasks.pre-push]
description = "Full verification before push"
dependencies = ["copy-wasm"]
script = """
set -e
cargo build --all-targets --release
cargo build --release --examples
cargo clippy --all-targets --release -- -D warnings
cargo fmt -- --check
cargo test --all-targets --release -- --nocapture
cargo test --manifest-path e2e_tests/Cargo.toml --release -- --nocapture --test-threads=1
echo "ALL CHECKS PASSED"
"""

[tasks.clean]
description = "Clean all build artifacts"
command = "bash"
args = ["-c", "cargo clean && cd contract && cargo clean"]
