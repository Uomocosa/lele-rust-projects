[package]
name = "freenet_example"
version = "0.1.2"
edition = "2024"

[lints.rust]
non_snake_case = "allow"

[lib]
name = "freenet_example"
path = "src/lib.rs"

[[bin]]
name = "freenet-example"
path = "src/main.rs"

[[test]]
name = "full_lifecycle"
path = "integration_tests/full_lifecycle.rs"

[[test]]
name = "persistence"
path = "integration_tests/persistence.rs"

[[test]]
name = "publish_subscribe"
path = "integration_tests/publish_subscribe.rs"

[[test]]
name = "standalone_demo"
path = "integration_tests/standalone_demo.rs"

[[test]]
name = "two_writers"
path = "integration_tests/two_writers.rs"

[[test]]
name = "multi_subscriber_notifications"
path = "integration_tests/multi_subscriber_notifications.rs"

[[test]]
name = "two_clients_talk_via_node"
path = "integration_tests/two_clients_talk_via_node.rs"

[[test]]
name = "gateway_subprocess_smoke"
path = "integration_tests/gateway_subprocess_smoke.rs"

[[example]]
name = "connect_to_external"
path = "scenarios/connect_to_external.rs"

[[example]]
name = "p2p_counter_gateway"
path = "scenarios/p2p_counter_gateway.rs"

[dependencies]
freenet = "0.2.71"
freenet-stdlib = { version = "0.8", features = ["net"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.27"
http = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "2"
tempfile = "3"
hex = "0.4"
