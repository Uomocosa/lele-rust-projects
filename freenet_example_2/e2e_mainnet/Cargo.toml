[package]
name = "e2e-mainnet-2"
version = "0.1.0"
edition = "2024"

[lib]
name = "e2e_mainnet_2"
crate-type = ["lib"]

[[bin]]
name = "e2e-mainnet-2"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
thiserror = "=2.0.20"
tempfile = "=3.27.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"] }
regex = "1"
dotenvy = "=0.15.7"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }