[workspace]
members = [".", "testing_3", "integration_tests_3", "cross_os_tests_3", "mainnet_automation_3"]
exclude = ["contract"]
resolver = "3"

[package]
name = "bevy_freenet_3"
version = "0.1.0"
edition = "2024"

[lib]
name = "freenet_libp2p_bevy_example_3_lib"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "freenet-libp2p-bevy-example-3"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
bevy = "=0.19.0"
avian2d = { version = "=0.7.0", default-features = false, features = [
    "2d", "f32", "parry-f32", "debug-plugin", "xpbd_joints", "enhanced-determinism",
] }
derive_more = { version = "=1.0.0", features = ["deref", "deref_mut"] }
bevy_lele_rollback_plugin_1 = { path = "../bevy_lele_rollback_plugin_1" }
freenet = "=0.2.128"
freenet-stdlib = { version = "=0.8.5", features = ["net"] }
libp2p = { version = "=0.56.0", features = [
    "tokio", "quic", "tcp", "noise", "yamux", "dns",
    "identify", "ping", "autonat", "relay", "dcutr",
    "request-response", "macros",
] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "=0.27.0"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
serde = { version = "=1.0.229", features = ["derive"] }
bincode = "=1.3.3"
async-trait = "=0.1.92"
futures = "=0.3.33"
futures-util = "=0.3.33"
http = "=1.5.0"
hex = "=0.4.3"
tempfile = "=3.27.0"

[dev-dependencies]