[package]
name = "cross_os_tests_3"
version = "0.1.0"
edition = "2024"

[[test]]
name = "peer_discovery"
path = "peer_discovery.rs"

[[test]]
name = "movement_sync"
path = "movement_sync.rs"

[[test]]
name = "engine_determinism"
path = "engine_determinism.rs"

[dependencies]
bevy = "=0.19.0"
tokio = { version = "=1.53.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
hex = "=0.4.3"
testing_3 = { path = "../testing_3" }
freenet-libp2p-bevy-example-3-lib = { path = "..", package = "bevy_freenet_3" }
