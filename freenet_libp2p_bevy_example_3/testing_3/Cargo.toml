[package]
name = "testing_3"
version = "0.1.1"
edition = "2024"

[dependencies]
bevy = "=0.19.0"
freenet-libp2p-bevy-example-3-lib = { path = "..", package = "bevy_freenet_3" }
freenet = "=0.2.128"
freenet-stdlib = { version = "=0.8.5", features = ["net"] }
libp2p = { version = "=0.56.0", features = ["macros"] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time", "net"] }
tempfile = "=3.27.0"
bincode = "=1.3.3"
serde = { version = "=1.0.229", features = ["derive"] }
hex = "=0.4.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }