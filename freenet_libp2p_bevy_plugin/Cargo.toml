[package]
name = "freenet-libp2p-bevy-plugin"
version = "0.1.0"
edition = "2024"
description = "Generic P2PBevyPlugin (Freenet discovery + libp2p Kademlia history) — Directory + Board contracts"
license = "MIT OR Apache-2.0"

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
module_inception = "allow"

[dependencies]
bevy = "=0.19.0"
derive_more = { version = "=2.1.1", features = ["deref", "deref_mut"] }
libp2p = { version = "=0.56.0", features = ["tokio", "quic", "tcp", "noise", "yamux", "dns", "identify", "ping", "relay", "dcutr", "request-response", "kad", "macros"] }
tokio = { version = "=1.52.3", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
thiserror = "=2.0.18"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
serde = { version = "=1.0.228", features = ["derive"] }
bincode = "=1.3.3"
async-trait = "=0.1.89"
futures = "=0.3.32"
futures-util = "=0.3.32"
hex = "=0.4.3"
blake3 = "=1.8.3"
clap = { version = "=4.5.39", features = ["derive"] }

[dev-dependencies]
