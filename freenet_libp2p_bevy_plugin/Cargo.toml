[workspace]
members = ["."]
exclude = ["contract"]
resolver = "3"

[package]
name = "freenet-libp2p-bevy-plugin"
version = "0.1.0"
edition = "2024"

[lib]
name = "freenet_libp2p_bevy_plugin_lib"
crate-type = ["lib", "cdylib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
bevy = "=0.19.0"
avian2d = "=0.7.0"
derive_more = { version = "=1.0.0", features = ["deref", "deref_mut"] }
freenet = "=0.2.128"
freenet-stdlib = { version = "=0.8.5", features = ["net"] }
libp2p = { version = "=0.56.0", features = [
    "tokio", "quic", "tcp", "noise", "yamux", "dns",
    "identify", "ping", "autonat", "relay", "dcutr",
    "request-response", "macros",
] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "=0.27.0"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
serde = { version = "=1.0.229", features = ["derive"] }
bincode = "=1.3.3"
async-trait = "=0.1.92"
futures = "=0.3.33"
futures-util = "=0.3.33"
http = "=1.5.0"
hex = "=0.4.3"
tempfile = "=3.27.0"